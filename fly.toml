# Fly.io config - alternative to Render. Deploy with `fly launch` (from
# inside backend/) then `fly deploy`, or `fly deploy --config ../fly.toml`
# from the repo root if you'd rather keep this file here.
app = "cloud-storage-backend"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENV = "production"
  SUPABASE_STORAGE_BUCKET = "files"
  MAX_UPLOAD_SIZE_MB = "100"
  # Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DATABASE_URL,
  # JWT_SECRET_KEY, CORS_ORIGINS) are NOT set here - Fly.io secrets don't
  # belong in a file that gets committed to git. Set them with:
  #   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... DATABASE_URL=... JWT_SECRET_KEY=... CORS_ORIGINS='["https://your-frontend"]'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  method = "GET"
